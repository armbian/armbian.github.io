# Kernel and u-boot packages that the stable repository update copies.
# Read by .github/workflows/infrastructure-repository-update.yml and passed
# to scripts/copy-kernel-packages.sh.

# LINUXFAMILY[:branch] tokens. Globs are allowed. No branch means all branches.
# Use the LINUXFAMILY, not the board: uefi-x86 is "x86", rpi4b is "bcm2711".
KERNEL_SELECT="x86 arm64 bcm2711 imx6"

# Also copy linux-libc-dev.
INCLUDE_LIBC_DEV="true"

# Board[:branch] tokens for linux-u-boot packages.
# CAREFUL: an empty UBOOT_SELECT copies the u-boot of every board.
COPY_UBOOT="true"
UBOOT_SELECT="udoo cubox-i"
