targets:
  # Debian minimal CLI for all boards
  nightly-debian-minimal:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: trixie
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - *nightly-fast-hdmi
      - *nightly-slow-hdmi
      - *nightly-headless
      - *nightly-riscv64
      - *nightly-loongarch

  # Ubuntu minimal CLI for all boards except riscv64 and loongarch
  nightly-ubuntu-minimal:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - *nightly-fast-hdmi
      - *nightly-slow-hdmi
      - *nightly-headless

  # Ubuntu minimal CLI for RISC-V boards (noble; resolute riscv64 is broken)
  nightly-ubuntu-riscv64-minimal:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: noble
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - *nightly-riscv64

  # Manual target additions for nightly builds
  # This content will be appended to the auto-generated targets-release-nightly.yaml

  # Ubuntu minimal cloud
  minimal-cli-stable-ubuntu-cloud:
    enabled: yes
    configs: [ armbian-cloud ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }

  # Debian minimal cloud
  minimal-cli-stable-debian-cloud:
    enabled: yes
    configs: [ armbian-cloud ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: trixie
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }

  # Khadas VIM1S / VIM4 on mainline (edge).
  # Both boards are in targets-release-nightly.blacklist, so the auto-generated
  # section skips them. Explicit target: Ubuntu minimal CLI.
  nightly-ubuntu-minimal-khadas-vims:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
