#
# Armbian release template. Auto-generated from image-info.json
#
common-gha-configs:
armbian-gha: &armbian-gha
  runners:
    default: "ubuntu-latest"
    by-name:
      kernel: [ "self-hosted", "Linux", "alfa" ]
      uboot: [ "self-hosted", "Linux", "fast", "X64" ]
      armbian-bsp-cli: [ "self-hosted", "Linux", "fast", "X64" ]
    by-name-and-arch:
      rootfs-armhf: [ "ubuntu-latest" ]
      rootfs-arm64: [ "self-hosted", "Linux", 'images', 'ARM64' ]
      rootfs-amd64: [ "self-hosted", "Linux", "X64" ]
      rootfs-riscv64: [ "ubuntu-24.04-riscv" ]
      rootfs-loong64: [ "self-hosted", "Linux", "X64" ]
      image-armhf: [ "self-hosted", "Linux", 'images', 'X64' ]
      image-arm64: [ "self-hosted", "Linux", 'images', 'ARM64' ]
      image-amd64: [ "self-hosted", "Linux", 'images', "X64" ]
      image-riscv64: [ "self-hosted", "Linux", 'images', "X64" ]
      image-loong64: [ "self-hosted", "Linux", 'images', "X64" ]

lists:
# Nightly builds - fast HDMI (quad-core+ or modern SoCs)
  nightly-fast-hdmi: &nightly-fast-hdmi
  # auto generated section
    - { BOARD: mba8mpxl, BRANCH: current, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: mba8mpxl-ras314, BRANCH: current, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: mekotronics-r58-4x4, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: mekotronics-r58hd, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: nanopct6-lts, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: nanopi-m6, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: nanopi-r3s-lts, BRANCH: current, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: nanopi-r6s, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: radxa-cm4-io, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: radxa-cm5-io, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: recomputer-rk3576-devkit, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: recomputer-rk3588-devkit, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: rock-5b-plus, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: rock-5c, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: rock-5t, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-am62-lp, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-am62-sip, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-am62b, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-am62p, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-am68, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-am69, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: sk-tda4vm, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: tmds62levm, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: tq-smarc2-tqma8mpxs, BRANCH: current, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: youyeetoo-r1-v3, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
    - { BOARD: youyeetoo-yy3588, BRANCH: vendor, ENABLE_EXTENSIONS: "v4l2loopback-dkms" }
  # end of auto generated section

  nightly-slow-hdmi: &nightly-slow-hdmi
  # auto generated section
    - { BOARD: bananapir2, BRANCH: current }
    - { BOARD: inovato-quadra, BRANCH: current }
    - { BOARD: mba93xxca-tqma93xx, BRANCH: current }
    - { BOARD: mba93xxla-mini, BRANCH: current }
  # end of auto generated section

  nightly-riscv64: &nightly-riscv64
  # auto generated section
    - { BOARD: k3picoitx, BRANCH: legacy }
    - { BOARD: musepipro, BRANCH: current }
  # end of auto generated section

  nightly-headless: &nightly-headless
  # auto generated section
    - { BOARD: gateway-gz80x, BRANCH: current }
    - { BOARD: sk-am64b, BRANCH: vendor }
    - { BOARD: tmds64evm, BRANCH: vendor }
  # end of auto generated section

# automated lists stop

targets:
  # Debian minimal CLI for all boards
  nightly-forky-all:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: forky
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - *nightly-fast-hdmi
      - *nightly-slow-hdmi
      - *nightly-headless
      - *nightly-riscv64

  # Ubuntu GNOME desktop for fast HDMI boards
  nightly-resolute-gnome:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "no"
      BUILD_DESKTOP: "yes"
      DESKTOP_ENVIRONMENT: "gnome"
      DESKTOP_TIER: "minimal"
    items:
      - *nightly-fast-hdmi

  # Ubuntu XFCE desktop for slow HDMI boards
  nightly-resolute-xfce:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "no"
      BUILD_DESKTOP: "yes"
      DESKTOP_ENVIRONMENT: "xfce"
      DESKTOP_TIER: "minimal"
    items:
      - *nightly-slow-hdmi

  # Ubuntu XFCE desktop for RISC-V boards (noble; resolute riscv64 is broken)
  nightly-resolute-riscv64-xfce:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: noble
      BUILD_MINIMAL: "no"
      BUILD_DESKTOP: "yes"
      DESKTOP_ENVIRONMENT: "xfce"
      DESKTOP_TIER: "minimal"
    items:
      - *nightly-riscv64

  # Ubuntu minimal CLI for headless boards
  nightly-resolute-minimal:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - *nightly-headless

  # Manual target additions for nightly builds
  # This content will be appended to the auto-generated targets-release-nightly.yaml

  # Ubuntu minimal cloud
  minimal-cli-stable-ubuntu-cloud:
    enabled: yes
    configs: [ armbian-cloud ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }

  # Debian minimal cloud
  minimal-cli-unstable-debian-cloud:
    enabled: yes
    configs: [ armbian-cloud ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: forky
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }

  # Debian minimal cloud (legacy duplicate of minimal-cli-unstable-debian-cloud
  # above — both blocks resolve to RELEASE: DEBIAN under the substitution
  # model, so they build the same image. Kept for now until a follow-up
  # decides whether to drop, or to introduce a second per-scope token to
  # carry an explicit "stable vs testing" Debian split inside nightly.)
  minimal-cli-stable-debian-cloud-trixie:
    enabled: yes
    configs: [ armbian-cloud ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: forky
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-iso" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-qcow2" }
      - { BOARD: uefi-arm64, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }
      - { BOARD: uefi-x86, BRANCH: cloud, ENABLE_EXTENSIONS: "image-output-vhdx" }

  # Ubuntu minimal CLI for Khadas VIM1S / VIM4 on mainline (current).
  # Both boards are in targets-release-nightly.blacklist so the auto-generated
  # section skips them. Note that removing them from the blacklist would NOT
  # produce this image: they are fast-HDMI boards, and that bucket only gets
  # Debian minimal + Ubuntu GNOME desktop. Ubuntu minimal CLI is emitted for
  # headless boards only, hence this explicit target.
  nightly-ubuntu-minimal-khadas-vims:
    enabled: yes
    configs: [ armbian-images ]
    pipeline:
      gha: *armbian-gha
    build-image: "yes"
    vars:
      RELEASE: resolute
      BUILD_MINIMAL: "yes"
      BUILD_DESKTOP: "no"
    items:
      - { BOARD: khadas-vim1s, BRANCH: current, ENABLE_EXTENSIONS: "image-output-oowow" }
      - { BOARD: khadas-vim4, BRANCH: current, ENABLE_EXTENSIONS: "image-output-oowow" }
