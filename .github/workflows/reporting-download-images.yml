name: "Reporting: Download images"

# Reports which images/versions we provide for download (from the source of
# truth armbian-images.json) and surfaces anomalies -- outdated boards,
# non-standard boards on the stable download, supported boards missing from the
# stable download, and desktop images for boards without video output. Output
# goes to the run's job summary.

on:
  workflow_dispatch:
    inputs:
      images_url:
        description: "armbian-images.json source (URL or path)"
        required: false
        default: "https://github.armbian.com/armbian-images.json"
      image_info_url:
        description: "image-info.json source (for the BOARD_HAS_VIDEO map)"
        required: false
        default: "https://github.armbian.com/image-info.json"
  schedule:
    - cron: "15 7 * * MON"   # weekly, Mondays 07:15 UTC

permissions:
  contents: read

jobs:
  report:
    name: "Download images report"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate report -> job summary
        run: |
          python3 scripts/report-download-images.py \
            --images "${{ github.event.inputs.images_url || 'https://github.armbian.com/armbian-images.json' }}" \
            --image-info "${{ github.event.inputs.image_info_url || 'https://github.armbian.com/image-info.json' }}"
