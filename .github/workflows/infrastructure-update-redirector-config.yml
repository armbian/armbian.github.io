name: "Infrastructure: Update CDN redirector"

# Regenerate the CDN redirector's per-variant YAML config from the mirror fleet:
#   Check  -> permissions
#   build  -> build a small reference FINGERPRINT for each platform from the
#             source of truth (apt/beta: suite->InRelease-hash; dl/archive:
#             torrent-relpath->size; cache: noop)
#   index  -> ask NetBox which mirror servers back each redirector variant
#   check  -> compare every mirror against the reference with plain per-file
#             GET/HEAD (in sync / not / timeout)
#   redirector -> turn the results into a per-variant redirector YAML
#   Close  -> commit the YAMLs to the data branch and refresh the directory listing
#
# The five variants (debs-beta, debs, images, archive, cache) are data-driven:
# the variant table lives once in scripts/redirector/, and the index/check/
# redirector jobs run as matrices over it.
#
# Why per-file probing (not an lftp directory mirror + diff): a large share of
# the fleet disables directory autoindex (403 on a directory, but serves the
# files themselves fine). Listing them is impossible, so the old tree-diff
# always reported them "not in sync". The reference is now a fingerprint the
# check verifies file by file, which works uniformly across the whole fleet.

on:
  repository_dispatch:
    types: ["Infrastructure: Update redirector"]
  workflow_dispatch:

env:
  GEODB: "/scripts/redirect-config/GeoLite2-City.mmdb"
  ASNDB: "/scripts/redirect-config/GeoLite2-ASN.mmdb"
  DL_MAP: "/scripts/redirect-config/all-images.json"
  CERTPATH: "/scripts/redirect-config/certdata.txt"
  SOURCE_OF_TRUTH: "https://armbian.atomonetworks.com"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Least-privilege default for GITHUB_TOKEN; jobs that need more opt in below.
permissions:
  contents: read

jobs:

  Check:
    name: "Check permissions"
    runs-on: "ubuntu-24.04"
    if: ${{ github.repository_owner == 'Armbian' }}
    steps:
      - name: "Check permissions"
        uses: armbian/actions/team-check@main
        with:
          ORG_MEMBERS: ${{ secrets.ORG_MEMBERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM: "Release manager"

  build:
    name: "Reference manifest: ${{ matrix.platform }}"
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'Armbian' }}
    needs: Check
    strategy:
      fail-fast: true   # a missing reference makes every mirror look out of sync
      matrix:
        platform: [ beta, apt, dl, archive, cache ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Install dependencies: lftp"
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: lftp
          version: 1.0

      # Build a small reference FINGERPRINT (not a mirrored tree): the suite ->
      # InRelease-hash map for apt/beta, or the torrent relpath -> size list for
      # dl/archive. The mirror check diffs against this with per-file GET/HEAD.
      - name: "Reference manifest for ${{ matrix.platform }}"
        run: scripts/redirector/build-reference.sh "${{ matrix.platform }}" "${{ env.SOURCE_OF_TRUTH }}"

      - name: "Upload ${{ matrix.platform }} manifest"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ref/manifest.tsv
          compression-level: 6
          retention-days: 2

  index:
    name: "Resolve mirror fleet from NetBox"
    runs-on: ubuntu-24.04
    needs: Check
    outputs:
      matrix: ${{ steps.q.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Query NetBox"
        id: q
        env:
          NETBOX_API: ${{ secrets.NETBOX_API }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: |
          set -euo pipefail
          matrix="$(scripts/redirector/netbox-mirrors.sh)"
          count="$(jq 'length' <<<"${matrix}")"
          # A matrix over 256 entries is rejected by Actions at dispatch time,
          # which reads as a workflow-syntax error rather than "fleet too big".
          if [[ "${count}" -gt 256 ]]; then
            echo "index: ${count} mirror/variant pairs exceeds the 256-job matrix limit; the check job needs chunking" >&2
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${count} mirror(s)." >> "$GITHUB_STEP_SUMMARY"

  mirrors:
    name: "Check ${{ matrix.node.server }}"
    runs-on: ubuntu-24.04
    needs: [ build, index ]
    if: ${{ needs.index.outputs.matrix != '' && needs.index.outputs.matrix != '[]' }}
    # Safety margin above check-mirror.sh's own CHECK_BUDGET (300s). The script
    # always finishes with a verdict inside its budget, so this cap should never
    # fire; if it ever did, a job killed here reports "cancelled" and poisons the
    # whole run -- which is exactly what we are avoiding.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.index.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Fetch reference manifest (${{ matrix.node.reference }})"
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.node.reference }}
          path: reference

      - name: "Compare mirror"
        env:
          # Via env, never inline in `run`: these come from NetBox, and a crafted
          # VM name would otherwise be interpolated straight into the shell.
          NODE_SERVER: ${{ matrix.node.server }}
          NODE_CHECK: ${{ matrix.node.check }}
          NODE_ID: ${{ matrix.node.id }}
        run: |
          set -euo pipefail
          scripts/redirector/check-mirror.sh \
            "${NODE_SERVER}" \
            "${NODE_CHECK}" \
            reference \
            "${NODE_ID}"

      - name: "Upload status"
        uses: actions/upload-artifact@v7
        with:
          name: mirror-status-${{ matrix.node.key }}-${{ matrix.node.id }}
          path: status
          if-no-files-found: ignore

  redirector:
    name: "Redirector config: ${{ matrix.variant }}"
    runs-on: ubuntu-24.04
    needs: mirrors
    # Publish from whatever mirror statuses we have, even if a single mirror job
    # failed or was cancelled -- one bad mirror must not skip regenerating the
    # config. summarize.sh still refuses to publish an empty failover pool, so a
    # variant with no in-sync mirror fails safe (keeps the previous config live).
    # !cancelled() so a human-cancelled run still stops cleanly.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: debsbeta, variant: debs-beta, port: "8083" }
          - { key: debs,     variant: debs,      port: "" }
          - { key: images,   variant: images,    port: "8081" }
          - { key: archive,  variant: archive,   port: "8082" }
          - { key: cache,    variant: cache,     port: "8084" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Collect ${{ matrix.variant }} statuses"
        uses: actions/download-artifact@v8
        with:
          path: status
          pattern: mirror-status-${{ matrix.key }}-*
          merge-multiple: true

      - name: "Summarize"
        run: scripts/redirector/summarize.sh status

      # One invocation for every variant: the action emits `bind:` only when port
      # is non-empty, so debs (no explicit port) keeps the default as before.
      - name: "Generate ${{ matrix.variant }} redirector YAML"
        uses: armbian/actions/make-yaml-redirector@main
        with:
          variant: ${{ matrix.variant }}
          failoverserver: "${{ env.failoverserver }}"
          port: "${{ matrix.port }}"
          geodb: "${{ env.GEODB }}"
          asndb: "${{ env.ASNDB }}"
          dl_map: "${{ env.DL_MAP }}"
          certDataPath: "${{ env.CERTPATH }}"
          reloadKey: ${{ env.reloadKey }}
          netbox: ${{ secrets.NETBOX_TOKEN }}
          netboxapi: ${{ secrets.NETBOX_API }}

  Close:
    needs: redirector
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the regenerated YAMLs to the data branch
      actions: write    # delete the intermediate index/status artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: armbian.github.io

      - uses: robinraju/release-downloader@v1.13
        with:
          repository: "P3TERX/GeoLite.mmdb"
          fileName: "*.mmdb"
          latest: true

      - name: Download redirector configs
        uses: actions/download-artifact@v8
        with:
          path: status
          pattern: config-*
          merge-multiple: true

      - name: "Commit changes if any"
        run: |
          set -euo pipefail
          cd armbian.github.io

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin data
          git checkout data

          mkdir -p data
          cp "${{ github.workspace }}"/status/*.yaml data/
          cp "${{ github.workspace }}"/*.mmdb data/

          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Redirector YAML configuration"
            # Push with retry logic
            max_attempts=3
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              if git push origin data; then
                echo "Successfully pushed to data branch"
                exit 0
              fi
              echo "Push failed, attempting to pull and rebase..." >&2
              git pull --rebase origin data || echo "Pull/rebase failed, will retry push..." >&2
              attempt=$((attempt + 1))
            done
            echo "Failed to push after $max_attempts attempts" >&2
            exit 1
          fi

      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            mirror-status-*
            config-*
            apt
            beta
            dl
            archive
            cache

      - name: "Generate directory"
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH }}
          event-type: "Web: Directory listing"
