# Refresh the live blocks in the organisation profile READMEs.
#
# Public profile:  armbian/.github          profile/README.md
# Member profile:  armbian/.github-private  profile/README.md
#
# scripts/update_org_profile.py rewrites only the text between
# <!-- auto:NAME --> markers. Hand-written text stays as is. A block whose
# source fails keeps its old content. The workflow opens one PR per profile
# repo and updates it in place. No PR when nothing changed.
#
# Secret: ACCESS_TOKEN_ARMBIANWORKER needs `repo` on both profile repos
# (one of them is private).
name: "Maintenance: Update organisation profile"

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * MON"   # weekly, Mondays 05:40 UTC

concurrency:
  group: update-org-profile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: "Profile: ${{ matrix.repo }}"
    if: ${{ github.repository_owner == 'armbian' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [armbian/.github, armbian/.github-private]
    steps:
      - name: Checkout tooling (this repo)
        uses: actions/checkout@v7

      - name: Checkout board configs
        uses: actions/checkout@v7
        with:
          repository: armbian/build
          path: build
          sparse-checkout: config/boards

      - name: Checkout profile repository
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.ACCESS_TOKEN_ARMBIANWORKER }}
          path: target

      - name: Refresh live blocks
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_ARMBIANWORKER }}
        run: python3 scripts/update_org_profile.py --build-dir build target/profile/README.md

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ACCESS_TOKEN_ARMBIANWORKER }}
          path: target
          branch: chore/update-org-profile
          delete-branch: true
          commit-message: "profile: refresh live data"
          title: "`Automatic` refresh organisation profile"
          body: |
            Weekly refresh of the `auto:` blocks in `profile/README.md`.
            Generated by [maintenance-update-org-profile.yml](https://github.com/armbian/armbian.github.io/blob/main/.github/workflows/maintenance-update-org-profile.yml).
